name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Test
    runs-on: windows
    timeout-minutes: 30

    # The runner executes as SYSTEM, whose effective execution policy is
    # Restricted - load step scripts with an explicit bypass so a host policy
    # reset can never fail the build
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore CheapShotcutRandomizer.slnx

      - name: Build
        run: dotnet build CheapShotcutRandomizer.slnx --no-restore --configuration Release

      - name: Test
        # xunit.v3 4.x is a Microsoft.Testing.Platform executable; dotnet test's
        # VSTest mode can no longer drive it, so run the test exe directly
        run: dotnet run --project CheapShotcutRandomizer.Tests/CheapShotcutRandomizer.Tests.csproj --no-build --configuration Release
