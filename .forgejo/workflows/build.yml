name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Test
    runs-on: windows
    timeout-minutes: 30

    # cmd instead of the default powershell wrapper: the runner executes as
    # SYSTEM, whose effective execution policy is Restricted and blocks the
    # generated step scripts; cmd has no policy to trip over
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore CheapShotcutRandomizer.slnx

      - name: Build
        run: dotnet build CheapShotcutRandomizer.slnx --no-restore --configuration Release

      - name: Test
        # xunit.v3 4.x is a Microsoft.Testing.Platform executable; dotnet test's
        # VSTest mode can no longer drive it, so run the test exe directly
        run: dotnet run --project CheapShotcutRandomizer.Tests/CheapShotcutRandomizer.Tests.csproj --no-build --configuration Release
