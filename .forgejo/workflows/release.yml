name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# No permissions block: Forgejo ignores it (GitHub Actions syntax) and newer
# versions warn about it - the injected token already carries the needed rights

jobs:
  release:
    name: Build and publish
    runs-on: windows
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, package, and publish to Forgejo
        # cmd + explicit -File bypass instead of act's powershell step wrapper:
        # the runner executes as SYSTEM, whose effective execution policy is
        # Restricted and blocks the generated wrapper scripts. The release
        # logic lives in deploy/release.ps1 and reads its inputs from env.
        shell: cmd
        env:
          REF_NAME: ${{ github.ref_name }}
          FORGE_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy\release.ps1
